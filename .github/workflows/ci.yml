name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Java / Spring Boot controller
  # ============================================================

  controller:
    name: Controller
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            controller/*.gradle
            controller/*.gradle.kts
            controller/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x controller/gradlew

      - name: Build and test controller
        working-directory: controller
        run: ./gradlew clean build --no-daemon


  # ============================================================
  # C++ worker
  # ============================================================

  worker:
    name: C++ Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libprotobuf-dev \
            libgrpc-dev \
            libgrpc++-dev

      - name: Configure worker
        run: |
          cmake \
            -S worker \
            -B worker/build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build worker
        run: |
          cmake \
            --build worker/build-ci \
            --parallel 2

      - name: Verify worker binary
        run: test -x worker/build-ci/forge-worker


  # ============================================================
  # Documentation / architecture diagrams
  # ============================================================

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make renderer executable
        run: chmod +x scripts/render-diagrams.sh

      - name: Render architecture diagrams
        run: ./scripts/render-diagrams.sh

      - name: Validate generated diagrams
        shell: bash
        run: |
          set -euo pipefail

          diagrams=(
            system-overview
            component-view
            successful-execution
            task-lifecycle
            worker-authority-recovery
            persistence-model
          )

          count=0

          for diagram in "${diagrams[@]}"; do
            for mode in light dark; do
              file="docs/diagrams/${diagram}-${mode}.svg"

              if [[ ! -f "$file" ]]; then
                echo "Missing: $file"
                exit 1
              fi

              if ! grep -q '<svg' "$file"; then
                echo "Invalid SVG: $file"
                exit 1
              fi

              echo "PASS $file"
              count=$((count + 1))
            done
          done

          if [[ "$count" -ne 12 ]]; then
            echo "Expected 12 SVGs, validated $count"
            exit 1
          fi

          echo "Validated all 12 architecture diagrams"

      - name: Validate Markdown diagram references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          documents = [
              Path("README.md"),
              Path("docs/architecture.md"),
          ]

          missing = []

          for document in documents:
              text = document.read_text()

              references = re.findall(
                  r'(?:src|srcset)="([^"]+\.svg)"',
                  text,
              )

              for reference in references:
                  target = document.parent / reference

                  if not target.exists():
                      missing.append(
                          f"{document}: {reference}"
                      )

          if missing:
              print("Broken diagram references:")

              for item in missing:
                  print(f"  {item}")

              raise SystemExit(1)

          print("PASS: all Markdown diagram references resolve")
          PY


  # ============================================================
  # End-to-end distributed execution
  # ============================================================

  integration:
    name: End-to-End
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - controller
      - worker

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            controller/*.gradle
            controller/*.gradle.kts
            controller/gradle/wrapper/gradle-wrapper.properties

      - name: Install worker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            libprotobuf-dev \
            libgrpc-dev \
            libgrpc++-dev

      - name: Build worker
        run: |
          cmake \
            -S worker \
            -B worker/build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build worker/build-ci \
            --parallel 2

      - name: Start controller
        run: |
          chmod +x controller/gradlew

          (
            cd controller

            ./gradlew bootRun --no-daemon \
              > /tmp/forge-controller.log 2>&1
          ) &

          echo $! > /tmp/forge-controller.pid

      - name: Wait for controller
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Forge controller..."

          for attempt in {1..60}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/api/workers \
              >/dev/null
            then
              echo "Controller is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Controller did not become ready"
          cat /tmp/forge-controller.log
          exit 1

      - name: Start worker
        run: |
          FORGE_OUTBOX_DIR=/tmp/forge-outbox \
            ./worker/build-ci/forge-worker \
            > /tmp/forge-worker.log 2>&1 &

          echo $! > /tmp/forge-worker.pid

      - name: Wait for worker registration
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Forge worker..."

          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8080/api/workers"

          for attempt in range(60):
              try:
                  with urllib.request.urlopen(
                      url,
                      timeout=2,
                  ) as response:
                      workers = json.load(response)

                  if any(
                      worker.get("online")
                      for worker in workers
                  ):
                      print("Worker registered and online")
                      raise SystemExit(0)

              except Exception as exc:
                  print(
                      f"attempt {attempt + 1}: "
                      f"{type(exc).__name__}"
                  )

              time.sleep(1)

          raise SystemExit(
              "Worker never became online"
          )
          PY

      - name: Run DAG smoke test
        run: |
          python3 scripts/dag_smoke_test.py

      - name: Show controller log
        if: always()
        run: |
          echo "================ Controller ================"
          cat /tmp/forge-controller.log || true

      - name: Show worker log
        if: always()
        run: |
          echo "================ Worker ===================="
          cat /tmp/forge-worker.log || true
