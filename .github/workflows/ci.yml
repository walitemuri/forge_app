name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  controller:
    name: Controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: controller/gradle/wrapper/gradle-wrapper.properties
      - name: Build and test
        working-directory: controller
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

  worker:
    name: Worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc-dev libgrpc++-dev
      - name: Build and test
        run: |
          cmake -S worker -B worker/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build worker/build-ci --parallel 2
          ctest --test-dir worker/build-ci --output-on-failure

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Test, lint, and build
        working-directory: dashboard
        run: |
          npm test
          npm run lint
          npm run build

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public Compose configuration
        env:
          FORGE_DOMAIN: forge.example.com
          FORGE_DB_PASSWORD: ci-only-placeholder
        run: docker compose -f docker-compose.yml -f docker-compose.public.yml config --quiet
      - name: Validate deployment scripts
        run: bash -n deploy/bootstrap-oracle-ubuntu.sh deploy/deploy.sh

  deploy:
    name: Deploy to Oracle Cloud
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.OCI_DEPLOY_ENABLED == 'true'
    needs: [controller, worker, dashboard, deployment-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.FORGE_URL }}
    concurrency:
      group: forge-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.OCI_HOST }}
      DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/oci_deploy"
          chmod 600 "$HOME/.ssh/oci_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact Git revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/oci_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/forge && ./deploy/deploy.sh '$REVISION'"
