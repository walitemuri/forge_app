# Overlay: docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
# Requires Compose 2.24+ for !reset. Run one dashboard instance.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${FORGE_DB_PASSWORD:?Set FORGE_DB_PASSWORD in .env}
    mem_limit: 512m

  controller:
    ports: !reset []
    environment:
      SPRING_DATASOURCE_PASSWORD: ${FORGE_DB_PASSWORD:?Set FORGE_DB_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    mem_limit: 1g
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  dashboard:
    ports: !reset []
    environment:
      FORGE_PUBLIC_DEMO: "true"
      FORGE_PUBLIC_ORIGIN: https://${FORGE_DOMAIN:?Set FORGE_DOMAIN in .env}
      FORGE_CHAOS_ENABLED: "false"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  worker-a: &worker-limits
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker-b: *worker-limits
  worker-c: *worker-limits

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FORGE_DOMAIN: ${FORGE_DOMAIN:?Set FORGE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forge-caddy-data:/data
      - forge-caddy-config:/config
    depends_on: [dashboard]
    networks: [forge]
    mem_limit: 256m

volumes:
  forge-caddy-data:
  forge-caddy-config:
